services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - sportsbetting-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrongPassword123!" -Q "SELECT 1" -C
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SportsBetting;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
      - Settings__Jwt__SigningKey=wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww
      - Settings__Jwt__ExpirationTimeMinutes=10000
      - Settings__FootballApi__BaseUrl=https://v3.football.api-sports.io
      - Settings__FootballApi__ApiKey=1ab52048e1e2ef57063b48b4d01e524d
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - sportsbetting-network

volumes:
  sqlserver_data:

networks:
  sportsbetting-network:
    driver: bridge
